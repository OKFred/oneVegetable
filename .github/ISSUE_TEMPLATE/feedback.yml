name: 产品反馈 / Product feedback
description: 报告问题或提出改进建议 / Report a problem or suggest an improvement
title: '[Feedback] '
body:
  - type: dropdown
    id: kind
    attributes:
      label: 反馈类型 / Feedback type
      options:
        - 问题 / Bug
        - 体验建议 / UX feedback
        - 功能建议 / Feature request
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 详细说明 / Details
      description: 请说明发生了什么，以及期望结果。 / Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Reproduction steps
      description: 如果适用，请列出可以稳定复现问题的步骤。 / If applicable, list the steps that reproduce the issue.
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: oneVegetable 自动生成的非敏感运行环境摘要。 / Non-sensitive runtime summary generated by oneVegetable.
      render: text
    validations:
      required: true
  - type: upload
    id: attachments
    attributes:
      label: 截图或附件 / Screenshots or attachments
      description: 可在这里粘贴 oneVegetable 已复制的截图。 / Paste the screenshot copied by oneVegetable here.
      accept: '.png,.jpg,.jpeg,.gif,.webp,.json,.log,.zip'
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认 / Privacy confirmation
      options:
        - label: 我已确认内容不包含密码、App Secret、Token 或不应公开的数据。 / I confirmed that this report contains no passwords, App Secrets, tokens, or data that should not be public.
          required: true
