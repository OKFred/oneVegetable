name: Publish formal release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: formal-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify immutable release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::Formal releases require an annotated Git tag."
            exit 1
          fi
          git fetch origin master --no-tags
          release_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/master; then
            echo "::error::Release commit must belong to origin/master."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and workspace versions
        run: pnpm check:release-version -- "${{ github.ref_name }}"
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum pnpm test:e2e
      - run: xvfb-run --auto-servernum pnpm test:e2e:bff-replay
      - run: pnpm release:extension
      - name: Preserve validated release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: one-vegetable-${{ github.ref_name }}
          path: |
            artifacts/one-vegetable-*-chrome-mv3.zip
            artifacts/one-vegetable-*-chrome-mv3.zip.sha256
            artifacts/release.json
          if-no-files-found: error
          retention-days: 90
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${GITHUB_REF_NAME} already exists; release assets are immutable."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/one-vegetable-*-chrome-mv3.zip \
            artifacts/one-vegetable-*-chrome-mv3.zip.sha256 \
            artifacts/release.json \
            --verify-tag \
            --title "oneVegetable ${GITHUB_REF_NAME}" \
            --generate-notes
