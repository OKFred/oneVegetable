<script>
  async function addon(nodeType, url) {
    let res = await fetch(url);
    let result = await res.text();
    let node = document.createElementNS('http://www.w3.org/1999/xhtml', nodeType);
    node.innerHTML = result;
    if (result === 'not found') return console.log('文件不存在');
    document.body.appendChild(node);
  }
</script>
<script>
  (async function getPageData() {
    const locale = navigator.languages.some((s) => s.includes('zh')) ? 'zhCN' : 'enUS';
    let res = await fetch(`${location.origin}/rest/${locale}.json`);
    let data = await res.json();
    if (!data || !data.status) return;
    document.getElementById('root').innerHTML = data.result;
    return;
  })();
</script>
